name: politica
# Política de PR da org (brabo-ci). Sem `if:` nos jobs: check obrigatório que se pula deixa veredito velho.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
permissions:
  contents: read
  pull-requests: write
jobs:
  pr-police:
    uses: viralabs-dev/brabo-ci/.github/workflows/pr-police.yml@a99f4892edb8e318ce06ddf61b229eb2022506ba  # v1.5.1
    with:
      ci_ref: 53200467cadc73c5c23b90545474d4948764932f  # v1.4.0
  escada:
    uses: viralabs-dev/brabo-ci/.github/workflows/approval-ladder.yml@53200467cadc73c5c23b90545474d4948764932f  # v1.4.0
    with:
      ci_ref: 53200467cadc73c5c23b90545474d4948764932f  # v1.4.0
